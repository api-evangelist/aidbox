apis:
- aid: aidbox:aidbox-fhir-api
  name: Aidbox FHIR API
  description: >-
    Aidbox's HL7 FHIR REST API for creating, reading, updating, deleting, and searching
    clinical and administrative resources. Supports FHIR R4 (4.0.1), R5, and R6, with
    standard FHIR interactions, transaction/batch bundles, and operations such as
    $validate, $everything, $document, and $lastn. The live public sandbox exposes a
    FHIR R4 CapabilityStatement listing 138 supported resource types at
    sandbox.aidbox.app/fhir/metadata.
  humanURL: https://www.health-samurai.io/docs/aidbox/api-1/fhir-api
  baseURL: https://sandbox.aidbox.app/fhir
  tags:
