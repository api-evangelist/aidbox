aid: aidbox
url: https://raw.githubusercontent.com/api-evangelist/aidbox/refs/heads/main/apis.yml
name: Aidbox
kind: company
description: >-
  Aidbox is a production-ready FHIR platform and clinical data backend from Health
  Samurai, used by digital health startups, providers, payers, and life-sciences
  teams to build interoperable healthcare products in the United States and globally.
  Built on PostgreSQL, Aidbox exposes a full HL7 FHIR REST API (R4, R5, and R6) plus
  Aidbox-native SQL search, SQL-on-FHIR, a GraphQL API, Bulk Data export/import,
  topic-based Subscriptions, and terminology services. It is self-hosted or
  Aidbox-hosted software rather than a single public multi-tenant endpoint, so each
  deployment serves its own FHIR base and its own CapabilityStatement; a public
  sandbox (sandbox.aidbox.app) exposes a live FHIR R4 CapabilityStatement and a
  SMART-on-FHIR / OpenID .well-known configuration. Authentication is OAuth 2.0 with
  SMART-on-FHIR support (patient/user/system scopes, EHR and standalone launch,
  client-confidential and client-public flows). Aidbox aligns with US interoperability
  needs (US Core, SMART App Launch, Bulk Data) and is HIPAA-oriented, HITRUST and
  SOC 2 focused. This profile catalogs the documented, real API surface only.
